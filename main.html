
<!DOCTYPE html>
<html lang="en">

<head>
    <!--
    Name: Lacy Austin
    Date: October 21, 2026
    Assignment: Week 2 - JSON and Bootstrap
    Purpose: Display favorite singers using Bootstrap
    and a JavaScript JSON object.
    -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Favorite Singers</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- JavaScript -->
    <script src="js/main.js" defer></script>

</head>

<body>

    <div class="container py-5">

        <!-- Website heading -->
        <header class="text-center mb-5">

            <h1 class="display-5 fw-bold">
                🎵 My Favorite Singers 🎸
            </h1>

            <p class="lead">
                A collection of my favorite artists
                and songs from different music genres.
            </p>

        </header>

        <!-- Bootstrap row -->
        <div class="row g-4">

            <!-- First column: concert image -->
            <div class="col-sm-4">

                <div class="card music-card">

                    <img
                        src="images/concert.jpg"
                        class="card-img-top concert-image"
                        alt="Live concert with stage lights">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Music I Love
                        </h5>

                        <p class="card-text">
                            From rock and metal to country,
                            R&amp;B, and hip-hop!
                        </p>

                    </div>

                </div>

            </div>

            <!-- Second column: singers table -->
            <div class="col-sm-8">

                <div class="card playlist-card">

                    <div class="card-body">

                        <h2 class="mb-4">
                            My Music Playlist
                        </h2>

                        <div class="table-responsive">

                            <table
                                class="table table-striped table-hover">

                                <thead>
                                    <tr>
                                        <th scope="col">Artist</th>
                                        <th scope="col">Favorite Song</th>
                                        <th scope="col">Genre</th>
                                    </tr>
                                </thead>

                                <!-- JavaScript fills this table -->
                                <tbody id="singerTable">
                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- Footer -->
        <footer class="text-center mt-5">

            <p>
                Created for Week 2 -
                JSON and Bootstrap Assignment
            </p>

        </footer>

    </div>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
